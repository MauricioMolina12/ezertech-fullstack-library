<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content class="confirm-dialog__content">
  <mat-icon fontIcon="help_outline"></mat-icon>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ data.cancelLabel ?? 'Cancelar' }}</button>
  <button mat-flat-button color="primary" (click)="confirm()">{{ data.confirmLabel }}</button>
</mat-dialog-actions>
