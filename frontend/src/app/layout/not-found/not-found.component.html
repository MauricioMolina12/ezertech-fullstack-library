<div class="not-found">
  <div class="not-found__code">404</div>
  <div class="not-found__icon">
    <mat-icon fontIcon="search_off"></mat-icon>
  </div>
  <h1 class="not-found__title">Página no encontrada</h1>
  <p class="not-found__message">
    La ruta que buscas no existe o ha sido movida. Revisa la URL o vuelve al catálogo.
  </p>
  <button mat-flat-button color="primary" (click)="goHome()">
    <mat-icon fontIcon="menu_book"></mat-icon>
    Ir al catálogo
  </button>
</div>
